# dev 서버(wes-dev-app) compose. docker-compose.prod.yml과 같은 규격이고 프로필과 로그 env 라벨만 다르다.
# cd-dev.yml이 이 파일을 보내고, 배포 스크립트(scripts/deploy-public-ssm.sh)가 서버의 docker-compose.prod.yml 자리에 둔다 —
# 롤백·교체 순서를 운영과 한 스크립트로 지키기 위해 서버 쪽 파일 이름은 바꾸지 않는다.
services:
  wes-api:
    # 저장소는 배포 스크립트가 넘긴다 — dev 는 ECR(#313, ASG 새 서버가 인스턴스 역할로 받음).
    image: ${IMAGE_REPOSITORY:?IMAGE_REPOSITORY must be set}:${IMAGE_TAG:?IMAGE_TAG must be set}
    container_name: wes-app
    restart: always
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - SERVER_PORT=8080
      - AWS_REGION=ap-northeast-2
      - TZ=Asia/Seoul
      # 힙 상한을 서버 메모리 안에 둔다(#274 A-1). t4g.micro 904MB에서 다른 프로세스 ≈ 200MB · JVM 힙 밖 ≈ 180MB를 빼면
      # 힙 448MB가 들어간다. 예전 MaxRAMPercentage=75(컨테이너 1g → 768MB)는 힙이 스왑으로 밀려 GC 때 앱 전체가 수십 초 멈췄다.
      # GC 로그는 실제 힙 사용량을 보고 값을 다듬기 위해 남긴다 — alloy는 info·warn·error 폴더만 보내므로 이 파일은 서버에만 있다.
      # GC는 G1로 고정한다(#286 (g) ②). 메모리가 1.8GB 아래면 JVM이 Serial(한 스레드로 앱을 멈추고 치움)을 골라 부하 때
      # Full GC로 최대 15초 멈췄다(R-3-c). G1은 짧게 나눠 치워 응답 꼬리를 줄이고, 자체 메모리는 힙의 수 % 정도다.
      # #313(10-16): micro 2대에서 이 값(+ 힙 밖 줄이기 조정 #318)으로도 GC 멈춤 6~19초 · ALB 이탈 · ASG 교체가 이어져(A-2m)
      # dev 서버를 운영과 같은 t4g.small 로 올렸다(infra #114). 그래서 JVM 값도 운영 compose 와 같게 둔다.
      - JAVA_TOOL_OPTIONS=-XX:+UseG1GC -Xmx448m -Xlog:gc:file=/var/log/spring/gc.log:time,uptime,level,tags:filecount=5,filesize=5m
    ports:
      - "8080:8080"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    volumes:
      # logback-spring.xml(prod | dev)의 LOG_PATH. 호스트에 남겨 alloy와 공유하고, 재배포에도 유지된다.
      - ./logs:/var/log/spring
    deploy:
      resources:
        limits:
          memory: 1g
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  # 로그 전송 사이드카. ./logs를 tail 해 모니터링 서버의 Loki로 민다(monitoring/config.alloy).
  # 앱과 독립이라 Loki가 죽어도 앱은 영향이 없다 — 파일은 쌓이고 alloy가 복구 후 이어서 보낸다.
  alloy:
    image: grafana/alloy:latest
    container_name: wes-alloy
    restart: always
    environment:
      # CD의 배포 스크립트가 Parameter Store(/wes/dev/app.logging.loki-url — 운영 값 복사본)에서 읽어 넘긴다.
      - LOKI_URL=${LOKI_URL}
      # Loki의 env 라벨(monitoring/config.alloy). dev 로그도 같은 Loki로 가므로 환경을 갈라 준다.
      - WES_ENV=dev
    volumes:
      - ./logs:/var/log/spring:ro
      - ./config.alloy:/etc/alloy/config.alloy:ro
      # 파일별 읽은 위치(positions). 없으면 재시작마다 파일을 처음부터 다시 보낸다.
      - ./alloy-data:/var/lib/alloy/data
    command: ["run", "--storage.path=/var/lib/alloy/data", "/etc/alloy/config.alloy"]
    deploy:
      resources:
        limits:
          # t4g.micro(1GiB)에서 앱 1g 한도와 같이 산다. 부족분은 스왑 2GB가 받는다.
          memory: 256m
    logging:
      driver: json-file
      options: { max-size: "5m", max-file: "2" }
