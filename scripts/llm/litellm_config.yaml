# codex-lb 를 OpenAI 호환 백엔드로 등록한다. 모델 슬러그는 `GET http://localhost:2455/v1/models` 로 확인한다.
# wes 는 app.llm.openai.model 에 아래 model_name 을 쓴다.
model_list:
  - model_name: codex-sol            # 최상위
    litellm_params:
      model: openai/gpt-5.6-sol
      api_base: http://codex-lb:2455/v1
      api_key: os.environ/CODEX_LB_API_KEY

  - model_name: codex-terra          # 균형
    litellm_params:
      model: openai/gpt-5.6-terra
      api_base: http://codex-lb:2455/v1
      api_key: os.environ/CODEX_LB_API_KEY

  - model_name: codex-luna           # 고속
    litellm_params:
      model: openai/gpt-5.6-luna
      api_base: http://codex-lb:2455/v1
      api_key: os.environ/CODEX_LB_API_KEY

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY

litellm_settings:
  drop_params: true        # codex-lb 가 모르는 파라미터는 조용히 뺀다
  request_timeout: 60
