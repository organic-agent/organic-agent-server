# 프로필 무관. 접속 정보(url·계정·비밀번호)는 Parameter Store에서 온다.
spring:
  datasource:
    driver-class-name: org.postgresql.Driver

  # 스키마는 Flyway가 소유한다(src/main/resources/db/migration). Hibernate는 엔티티와
  # 어긋나는지 확인만 한다. pgvector 확장은 테이블 생성보다 CREATE EXTENSION이 먼저
  # 와야 해서 ddl-auto로는 만들 수 없다 — 그것이 이 전환의 직접적인 이유다.
  flyway:
    # 운영 DB에는 ddl-auto가 만들어 둔 테이블이 이미 있다. 이 옵션이 없으면 Flyway가
    # "비어 있지 않은 스키마"를 보고 기동을 거부한다.
    baseline-on-migrate: true
    # 0이라서 V1도 실제로 실행된다. 1로 두면 "스키마가 비어 있지 않다"만 보고 V1이 이미
    # 적용된 것으로 단정하는데, 그 단정은 검증되지 않는다 — 테이블이 일부만 있는 DB가
    # V1을 건너뛰고 V2에서 깨진다(실제로 로컬에서 그렇게 깨졌다).
    # V1은 전부 IF NOT EXISTS라 이미 있는 DB에서도 안전하게 다시 돈다.
    baseline-version: 0

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    generate-ddl: false
    properties:
      hibernate:
        # 서버·DB 시간대를 KST로 고정한다. 못박지 않으면 JVM 기본 타임존을 따라가 서버 환경에 좌우된다.
        jdbc:
          time_zone: Asia/Seoul

---
spring:
  config:
    activate:
      on-profile: local

  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true

---
spring:
  config:
    activate:
      on-profile: prod

  jpa:
    show-sql: false
