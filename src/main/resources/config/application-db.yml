# 프로필 무관. 접속 정보(url·계정·비밀번호)는 Parameter Store에서 온다.
spring:
  datasource:
    driver-class-name: org.postgresql.Driver

  # 스키마는 단일 V1 베이스라인을 Flyway가 소유한다. Hibernate는 엔티티와
  # 어긋나는지 확인만 한다. pgvector 확장은 테이블 생성보다 CREATE EXTENSION이 먼저
  # 와야 해서 ddl-auto로는 만들 수 없다.
  flyway:
    # 베이스라인 재설정 후에는 빈 DB에만 V1을 적용한다. 기존 스키마를 무시한
    # 중간 상태를 허용하지 않도록 자동 baseline은 끄는다.
    baseline-on-migrate: false

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    generate-ddl: false
    properties:
      hibernate:
        # 서버·DB 시간대를 KST로 고정한다. 못박지 않으면 JVM 기본 타임존을 따라가 서버 환경에 좌우된다.
        jdbc:
          time_zone: Asia/Seoul
          # 할당 id 엔티티의 saveAll이 INSERT를 묶어 보내게 한다. IDENTITY 엔티티에는 효과가 없다(Hibernate가 행마다 id를 받아야 해서).
          batch_size: 100
        order_inserts: true
        order_updates: true

---
spring:
  config:
    activate:
      on-profile: local

  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true

---
spring:
  config:
    activate:
      on-profile: prod

  jpa:
    show-sql: false
