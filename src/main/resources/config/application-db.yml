# 프로필 무관. 접속 정보(url·계정·비밀번호)는 Parameter Store에서 온다.
spring:
  datasource:
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    properties:
      hibernate:
        # 서버·DB 시간대를 KST로 고정한다. 못박지 않으면 JVM 기본 타임존을 따라가 서버 환경에 좌우된다.
        jdbc:
          time_zone: Asia/Seoul

---
spring:
  config:
    activate:
      on-profile: local

  jpa:
    hibernate:
      ddl-auto: create
    generate-ddl: true
    show-sql: true
    defer-datasource-initialization: true
    properties:
      hibernate:
        format_sql: true

---
spring:
  config:
    activate:
      on-profile: prod

  jpa:
    hibernate:
      # TODO(런칭 전 필수): validate로 바꾸고 스키마는 Flyway/Liquibase 마이그레이션으로 관리한다.
      # update는 없는 테이블·컬럼만 생성하고 기존 데이터는 보존한다. create처럼 재기동마다 drop하지 않는다.
      ddl-auto: update
    generate-ddl: true
    show-sql: false
    defer-datasource-initialization: true
