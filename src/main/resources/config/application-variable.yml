# 비밀도 아니고 배포 인프라에 종속되지도 않는 값들. 코드와 함께 리뷰·추적돼야 하므로
# Parameter Store가 아니라 저장소에 둔다.
# Parameter Store로 가는 값은 docs/notes/parameter-store-mapping.md 참고.

spring:
  security:
    oauth2:
      client:
        # registration은 전부 Parameter Store에서 온다(client-id/secret, redirect-uri, scope 등).
        # 여기에는 제공자 엔드포인트만 둔다. 바뀌면 코드 변경이지 환경 설정이 아니다.
        # google은 Spring Boot에 내장되어 있어 따로 적지 않는다.
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id
          naver:
            authorization-uri: https://nid.naver.com/oauth2.0/authorize
            token-uri: https://nid.naver.com/oauth2.0/token
            user-info-uri: https://openapi.naver.com/v1/nid/me
            user-name-attribute: response

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha
    # Authorize로 넣은 토큰이 새로고침 후에도 유지된다. 매번 다시 붙여넣지 않아도 된다.
    persist-authorization: true

# 만료 시간은 비밀이 아니라 보안 정책이다. 30분을 30일로 늘리는 건 PR에 남아야 하므로
# Parameter Store에 두지 않는다. secret만 Parameter Store에서 온다.
jwt:
  access-token-expiration: 30m
  refresh-token-expiration: 14d

app:
  retouch:
    pdf:
      # 1GB 공개 API 컨테이너에서 동기 생성 메모리와 ALB 응답 시간을 제한한다.
      max-photos: 200
      max-pages: 1000
      max-text-characters: 200000
      max-output-bytes: 52428800
      image-long-edge: 2048
      max-concurrent-generations: 1
      generation-timeout: 45s
  admin:
    session:
      absolute-ttl: 8h
      idle-ttl: 30m
    lockout:
      max-failed-attempts: 5
      duration: 30m
    observability:
      # 운영 환경은 Parameter Store에서 내부 Grafana·Loki 조회 주소를 덮어쓴다.
      # 비어 있으면 백오피스가 임의의 외부 주소를 만들지 않고 미구성 상태를 명시한다.
      grafana-base-url: ""
      loki-base-url: ""
    workflow-executor:
      # 외부 연동이 비어 있으면 작업을 성공으로 위장하지 않고 FAILED로 남긴다.
      enabled: true
      batch-size: 20
      max-attempts: 5
      retry-delay: 1m
      stale-timeout: 10m
      # 운영 Lambda event age 20m + 함수 timeout 15m + 종료 반영 여유 5m.
      dispatched-timeout: 40m
      fixed-delay: 10s

  trash:
    # 휴지통 보관 기간. 지난 사진·갤러리는 purge 스케줄러가 S3 객체와 함께 물리 삭제한다.
    # 비밀이 아니라 제품 정책이라 저장소에 둔다 — 3일을 30일로 바꾸는 건 PR에 남아야 한다.
    retention: 7d

  storage:
    # 버킷 이름만 인프라에 종속된다. 환경마다 버킷이 다르며(prod는 운영 버킷, dev는 dev 버킷, local은 로컬 버킷)
    # Parameter Store(/wes/{local,dev,prod}/app.storage.bucket)가 덮어쓴다. 테스트에는 실제 버킷이
    # 없으므로 서명 형태만 확인하는 더미 값을 둔다.
    bucket: wes-local-photos
    # 프론트가 수천 장을 순차 업로드하는 동안 만료되지 않을 만큼은 길어야 한다.
    upload-url-ttl: 30m
    # 조회용 서명 URL의 수명. 업로드보다 짧게 잡는다 — 목록을 다시 부르면 새 URL이 나오므로
    # 짧아도 화면이 막히지 않고, 응답의 viewUrlTtlSeconds로 프론트에 그 시간을 알려준다.
    view-url-ttl: 15m
    # 상세 화면에서 원본을 여는 URL의 수명. 목록과 달리 한 장을 오래 열어두는 화면이라
    # 15분으로는 확대해 보는 도중에 만료된다. 만료된 URL은 이미지가 사라지는 것이 아니라
    # S3가 403을 돌려주는 것이라, 사용자에게는 사진이 깨진 것처럼 보인다.
    original-url-ttl: 1h
    # 한 요청에서 발급할 수 있는 URL 개수이자 한 번에 담을 수 있는 사진 수. 프론트는 리사이즈를 끝낸 배치 단위로 받는다.
    # 목록 조회의 페이지 크기 상한은 코드 상수(global/page/PageRequests.MAX_SIZE)가 따로 담당한다.
    max-batch-size: 500
    # 원본 한 장의 바이트 상한(20MB). 프론트가 2048px 로 리사이즈해 올리므로 정상 사진은 1~2MB 다 — 초과는 리사이즈를 건너뛴 신호다.
    max-upload-bytes: 20971520
    # 완료 통보 없이 남은 PENDING 사진의 서버 확인 규칙(첫 확인 · 재확인 간격 · 포기).
    pending-first-check-after: 1m
    pending-recheck-every: 10m
    pending-give-up-after: 24h

  folder:
    # 이미 폴더가 있는 갤러리에 새 세부 폴더를 만드는 최소 장수. 기존 폴더에 못 들어간 새 사진이 이보다 적으면 미분류로 둔다.
    # 처음 분석에는 걸지 않는다.
    min-new-detail-photos: 5
    # 새 사진뿐인 그룹을 같은 세부 이름의 옛 사진이 든 폴더로 합치는 조건 — 그 세부 이름의 사진 중 옛 사진 비율이 이 값 이상.
    min-old-share-for-detail-merge: 0.1
    # 세부 폴더 합치기를 되돌릴 수 있는 시간. 웹의 "실행 취소"는 알림이 떠 있는 몇 초만 쓴다.
    merge-undo-window: 3m

  analysis:
    # 분석 파이프라인 — 임베더 배정(스윕) · 잡(ANALYZING → CATEGORIZING → DONE) · Lambda 함수 이름.
    # prod는 Parameter Store(app.analysis.embedder-function-name, score-function-name, categorize-function-name)가 덮어쓴다.
    # 로컬·테스트에는 Lambda가 없으므로 빈 값이 정상이다 — 기동이 아니라 호출 시점에 503.
    embedder-function-name: ""
    score-function-name: ""
    categorize-function-name: ""
    # local 프로필만: Lambda 대신 띄울 대역 스크립트 디렉토리(작업 디렉토리 기준). 함수 하나 = <디렉토리>/<함수>.sh.
    # 프로필 블록(application.yml)이 채운다.
    local-script-dir: ""
    # 임베더 배정: EVENT 하나에 담는 사진 수 · 동시에 떠 있는 배치 수 상한(인프라 예약 동시성 ≥ 이 값) ·
    # 벡터 없이 이 시간이 지나면 배정을 되돌려 다시 보냄 · 사진 한 장의 배정 상한(넘으면 photo_analysis.error).
    # max-in-flight 48(#274 E-1): 임베더가 적재 때만 DB 연결을 잡게 바뀐 뒤(AI #147)라 연결 수가 동시 실행 수만큼 늘지 않는다.
    embed-batch-size: 50
    embed-max-in-flight: 48
    embed-redispatch-after: PT10M
    embed-max-attempts: 3
    # score Lambda 폴백 EVENT 하나에 담는 사진 수(GPU 워커가 못 낼 때만).
    score-batch-size: 50
    # 이 시간 안에 발급된 PENDING 사진은 "아직 올라오는 중"으로 보고 점수 완료 판정을 미룬다.
    upload-quiet-after: PT2M
    # categorize EVENT 뒤 이 시간 안에 배정 행이 없으면 다시 보낸다(7천 장 약 70초보다 넉넉히). 상한을 넘기면 잡 FAILED.
    categorize-timeout: PT20M
    categorize-max-attempts: 3
    # 잡의 모든 대기에 끝을 둔다.
    # - analyzing-stall-after: ANALYZING 의 진행이 이 시간 동안 없으면 멈춤. embed-redispatch-after × embed-max-attempts 보다 길어야 한다.
    # - stall-detach-ratio: 멈췄을 때 뒤처진 사진이 대상의 이 비율 이하면 그 사진만 떼어 내고(photo_analysis.error) 잡은 계속 간다. 넘으면 잡 FAILED.
    # - categorizing-deadline: CATEGORIZING 진입 뒤 이 시간이 지나면 잡 FAILED. categorize-timeout × categorize-max-attempts + 여유.
    # - materialize-max-attempts: 폴더 만들기 예외 상한. score-fallback-max: 갤러리당 score Lambda 폴백 상한.
    analyzing-stall-after: PT35M
    stall-detach-ratio: 0.05
    categorizing-deadline: PT70M
    materialize-max-attempts: 3
    score-fallback-max: 3
    # 분석 스윕 한 회차가 이 시간 동안 끝나지 않으면 하트비트가 디스코드로 알린다(멈출 때 한 번, 돌아올 때 한 번).
    # DB가 멈춰도 연결 안전망(socketTimeout 120초) 안에 회차가 끝나므로 그보다 길게 둔다.
    sweep-stall-after: PT3M
    # 잡이 끝날 때 그 잡의 몫인 분석 실패 사진(photo_analysis.error)이 한 장이라도 있으면 디스코드로 알린다. 알림의 링크는 백오피스의 그 갤러리다.
    # 웹훅 주소는 비밀값이라 여기 두지 않는다 — prod 는 Parameter Store(app.analysis.discord-webhook-url)가 채우고, 비어 있으면 로그만 남긴다.
    backoffice-base-url: https://admin.easyselect.kr
    discord-webhook-url: ""
    # GPU score 워커. 켜져 있으면 스윕이 backlog(점수 없는 UPLOADED 사진)를 보고 EC2 인스턴스(Name 태그 = tag)를 켠다. 끄기는
    # 워커의 유휴 30초 자기 정지가 1차이고 idle-stop-after 는 그것이 실패했을 때의 안전망이다. 워커가 fallback-after 동안 뜨지 않거나
    # 점수가 멈추면 score Lambda 폴백을 갤러리당 fallback-interval 마다 보낸다. 꺼져 있으면(로컬·테스트·GPU 배포 전) 폴백만 돈다.
    # prod 는 Parameter Store(app.analysis.gpu.enabled)가 켠다.
    gpu:
      enabled: false
      tag: wes-score-gpu
      start-grace: PT5M
      idle-stop-after: PT2M
      fallback-after: PT10M
      fallback-interval: PT10M
    # 임베더 배정과 살아 있는 잡을 한 걸음씩 옮기는 스윕 주기.
    sweep-interval: PT5S

  llm:
    # Bedrock(Anthropic Messages) 호출. 지금은 보정 요청 다듬기만 쓴다 — 꺼져 있으면 다듬지 못했다고 답한다.
    # prod는 Parameter Store(/wes/prod/app.llm.enabled=true)가 켠다. 로컬에서 켜려면 개발자 AWS
    # 자격증명에 bedrock:InvokeModel이 있어야 한다.
    enabled: false
    # 서울에는 Sonnet 온디맨드가 없어 global. 크로스 리전 프로필을 쓴다 — 요청이 국외로 나간다.
    region: ap-northeast-2
    model-id: global.anthropic.claude-sonnet-4-6

  mock-gallery:
    # Mock 갤러리가 복제할 샘플 템플릿 갤러리 id. 0은 "기능 꺼짐"이다(생성 요청이 503).
    # 템플릿은 운영자 스튜디오가 일반 파이프라인으로 시드한 진짜 갤러리라 환경마다 id가 다르다.
    # prod는 시드를 마친 뒤 Parameter Store(app.mock-gallery.template-gallery-id)가 덮어쓴다.
    template-gallery-id: 0

  invite:
    # 초대 링크의 앞부분. 뒤에 토큰이 붙어 완성된 링크가 된다.
    # 서버 주소가 아니라 프론트 주소다 — 링크를 받은 사람이 여는 것은 API가 아니라 수락 화면이고,
    # 그 화면이 로그인을 확인한 뒤 수락 API를 부른다.
    # prod는 배포 도메인을 따라가므로 Parameter Store(app.invite.base-url)가 덮어쓴다.
    base-url: "http://localhost:3000/invite"

  collab:
    # 하객 협업 링크의 앞부분. 초대 링크와 같은 규칙이지만 여는 화면이 다르다 —
    # 이쪽은 로그인을 요구하면 안 된다. 로그인하지 않는 하객·부모님을 위해 만든 링크다.
    # prod는 배포 도메인을 따라가므로 Parameter Store(app.collab.base-url)가 덮어쓴다.
    base-url: "http://localhost:3000/collab"

---
spring:
  config:
    activate:
      on-profile: local

# localhost 고정값이라 숨길 것도, 인프라에 따라 달라질 것도 없다.
# prod 값은 도메인이 정해져야 하므로 Parameter Store에서 온다.
springdoc:
  server-url: "http://localhost:8080"

# 쉼표로 구분된 문자열. @Value("${cors.allowed-origins}") List<String>가 쉼표로 쪼갠다.
# YAML 리스트로 쓰면 cors.allowed-origins[0]... 인덱스 키가 되어 스칼라 플레이스홀더가 안 잡힌다.
# prod는 Parameter Store에서 같은 쉼표 문자열로 온다.
cors:
  allowed-origins: "http://localhost:3000,http://localhost:5173"

# 기본 레벨은 INFO다. SQL·필터·요청 로그는 전부 DEBUG 이하라 켜주지 않으면 한 줄도 안 남는다.
# 운영에 그대로 나가면 매 쿼리와 필터 실행이 찍혀 로그를 잡아먹으므로 로컬 전용으로 둔다.
logging:
  level:
    com.soma.wes: DEBUG
    org.hibernate.SQL: DEBUG
    # SQL의 `?`에 실제로 바인딩된 값. Hibernate 6부터 로거 이름이 이걸로 바뀌었다.
    org.hibernate.orm.jdbc.bind: TRACE
    org.springframework.security.web.FilterChainProxy: TRACE
    # 시작 시 "Mapping filters: ..." — 서블릿 컨테이너에 등록된 필터 목록과 순서(order)
    org.springframework.boot.web.servlet: DEBUG

---
spring:
  config:
    activate:
      # dev 서버는 운영과 같은 규격이라 같은 블록을 쓴다.
      on-profile: prod, dev

# ALB가 TLS를 끝내고 평문 HTTP로 넘긴다. 이 설정이 없으면 앱은 자기가 http://로 서비스되는 줄 알고
# 절대 URL과 리다이렉트를 http로 만든다. X-Forwarded-* 를 읽어 원래 요청(https, api.easyselect.kr)을
# 복원한다. `framework`는 서블릿 컨테이너가 아니라 Spring의 필터로 처리한다는 뜻이다.
server:
  forward-headers-strategy: framework

# /actuator/**는 PublicPaths에서 인증 없이 열려 있다. 노출 대상을 명시해 두지 않으면
# 나중에 다른 엔드포인트가 켜졌을 때 그대로 공개된다. health 하나만 연다.
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      # 컨테이너·ALB의 health check는 up/down만 알면 된다. DB 접속 정보나 디스크 용량 같은
      # 내부 사정을 인증 없이 내보낼 이유가 없다.
      show-details: never

# springdoc.server-url과 cors.allowed-origins는 Parameter Store(/wes/prod/)에서 온다.
# cors.allowed-origins에 배포 프론트와 함께 http://localhost:3000을 넣어두면,
# 로컬 프론트로도 운영 API에 붙어 로그인을 테스트할 수 있다(아래 redirect-uri 규칙과 맞물린다).

oauth:
  fallback-redirect-origin: http://localhost:3000

logging:
  level:
    com.soma.wes: INFO

---
spring:
  config:
    activate:
      on-profile: dev

# 실패 사진 알림의 백오피스 링크는 dev 관리자(wes-dev-admin)를 연다 — 운영 백오피스를 dev 갤러리 id로 열지 않게.
app:
  analysis:
    backoffice-base-url: https://dev.admin.easyselect.kr
