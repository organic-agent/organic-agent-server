# 비밀도 아니고 배포 인프라에 종속되지도 않는 값들. 코드와 함께 리뷰·추적돼야 하므로
# Parameter Store가 아니라 저장소에 둔다.
# Parameter Store로 가는 값은 docs/notes/parameter-store-mapping.md 참고.

spring:
  security:
    oauth2:
      client:
        # registration은 전부 Parameter Store에서 온다(client-id/secret, redirect-uri, scope 등).
        # 여기에는 제공자 엔드포인트만 둔다. 바뀌면 코드 변경이지 환경 설정이 아니다.
        # google은 Spring Boot에 내장되어 있어 따로 적지 않는다.
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id
          naver:
            authorization-uri: https://nid.naver.com/oauth2.0/authorize
            token-uri: https://nid.naver.com/oauth2.0/token
            user-info-uri: https://openapi.naver.com/v1/nid/me
            user-name-attribute: response

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha
    # Authorize로 넣은 토큰이 새로고침 후에도 유지된다. 매번 다시 붙여넣지 않아도 된다.
    persist-authorization: true

# 만료 시간은 비밀이 아니라 보안 정책이다. 30분을 30일로 늘리는 건 PR에 남아야 하므로
# Parameter Store에 두지 않는다. secret만 Parameter Store에서 온다.
jwt:
  access-token-expiration: 30m
  refresh-token-expiration: 14d

app:
  admin:
    session:
      absolute-ttl: 8h
      idle-ttl: 30m
    lockout:
      max-failed-attempts: 5
      duration: 30m
    observability:
      # 운영 환경은 Parameter Store에서 내부 Grafana·Loki 조회 주소를 덮어쓴다.
      # 비어 있으면 백오피스가 임의의 외부 주소를 만들지 않고 미구성 상태를 명시한다.
      grafana-base-url: ""
      loki-base-url: ""
    workflow-executor:
      # 외부 연동이 비어 있으면 작업을 성공으로 위장하지 않고 FAILED로 남긴다.
      enabled: true
      batch-size: 20
      max-attempts: 5
      retry-delay: 1m
      stale-timeout: 10m
      # 운영 Lambda event age 20m + 함수 timeout 15m + 종료 반영 여유 5m.
      dispatched-timeout: 40m
      fixed-delay: 10s

  trash:
    # 휴지통 보관 기간. 지난 사진·갤러리는 purge 스케줄러가 S3 객체와 함께 물리 삭제한다.
    # 비밀이 아니라 제품 정책이라 저장소에 둔다 — 3일을 30일로 바꾸는 건 PR에 남아야 한다.
    retention: 7d

  storage:
    # 버킷 이름만 인프라에 종속된다. 환경마다 버킷이 다르며(prod는 운영 버킷, local은 dev 버킷)
    # Parameter Store(/wes/{local,prod}/app.storage.bucket)가 덮어쓴다. 테스트에는 실제 버킷이
    # 없으므로 서명 형태만 확인하는 더미 값을 둔다.
    bucket: wes-local-photos
    # 프론트가 수천 장을 순차 업로드하는 동안 만료되지 않을 만큼은 길어야 한다.
    upload-url-ttl: 30m
    # 조회용 서명 URL의 수명. 업로드보다 짧게 잡는다 — 목록을 다시 부르면 새 URL이 나오므로
    # 짧아도 화면이 막히지 않고, 응답의 viewUrlTtlSeconds로 프론트에 그 시간을 알려준다.
    view-url-ttl: 15m
    # 상세 화면에서 원본을 여는 URL의 수명. 목록과 달리 한 장을 오래 열어두는 화면이라
    # 15분으로는 확대해 보는 도중에 만료된다. 만료된 URL은 이미지가 사라지는 것이 아니라
    # S3가 403을 돌려주는 것이라, 사용자에게는 사진이 깨진 것처럼 보인다.
    original-url-ttl: 1h
    # 한 요청에서 발급할 수 있는 URL 개수이자 한 번에 담을 수 있는 사진 수.
    # 목록 조회의 페이지 크기 상한은 코드 상수(global/page/PageRequests.MAX_SIZE)가 따로 담당한다.
    max-batch-size: 1000

  embedding:
    # prod는 Parameter Store(app.embedding.function-name)가 덮어쓴다.
    # 로컬·테스트에는 Lambda가 없으므로 빈 값이 정상이다 — 기동이 아니라 호출 시점에 실패한다.
    function-name: ""
    # local 프로필만: Lambda 대신 서브프로세스로 띄울 스크립트(작업 디렉토리 기준). 프로필 블록(application.yml)이 채운다.
    local-script: ""

  llm:
    # Bedrock(Anthropic Messages) 호출. 꺼져 있으면 비교샷은 템플릿 판정, 추천 이유는 폴백 문장이다.
    # prod는 Parameter Store(/wes/prod/app.llm.enabled=true)가 켠다. 로컬에서 켜려면 개발자 AWS
    # 자격증명에 bedrock:InvokeModel이 있어야 한다.
    enabled: false
    # 서울에는 Sonnet 온디맨드가 없어 global. 크로스 리전 프로필을 쓴다 — 요청이 국외로 나간다.
    region: ap-northeast-2
    model-id: global.anthropic.claude-sonnet-4-6
    # 나머지 손잡이(image-long-edge, compare-timeout, reasons-batch …)는 LlmProperties 기본값이다.
    # 값의 정본은 AI repo photoselect/docs/plan-v3-folder-compare.md §2·§3 — 바꾸면 그 문서를 먼저 고친다.

  mock-gallery:
    # Mock 갤러리가 복제할 샘플 템플릿 갤러리 id. 0은 "기능 꺼짐"이다(생성 요청이 503).
    # 템플릿은 운영자 스튜디오가 일반 파이프라인으로 시드한 진짜 갤러리라 환경마다 id가 다르다.
    # prod는 시드를 마친 뒤 Parameter Store(app.mock-gallery.template-gallery-id)가 덮어쓴다.
    template-gallery-id: 0

  invite:
    # 초대 링크의 앞부분. 뒤에 토큰이 붙어 완성된 링크가 된다.
    # 서버 주소가 아니라 프론트 주소다 — 링크를 받은 사람이 여는 것은 API가 아니라 수락 화면이고,
    # 그 화면이 로그인을 확인한 뒤 수락 API를 부른다.
    # prod는 배포 도메인을 따라가므로 Parameter Store(app.invite.base-url)가 덮어쓴다.
    base-url: "http://localhost:3000/invite"

  collab:
    # 하객 협업 링크의 앞부분. 초대 링크와 같은 규칙이지만 여는 화면이 다르다 —
    # 이쪽은 로그인을 요구하면 안 된다. 로그인하지 않는 하객·부모님을 위해 만든 링크다.
    # prod는 배포 도메인을 따라가므로 Parameter Store(app.collab.base-url)가 덮어쓴다.
    base-url: "http://localhost:3000/collab"

---
spring:
  config:
    activate:
      on-profile: local

# localhost 고정값이라 숨길 것도, 인프라에 따라 달라질 것도 없다.
# prod 값은 도메인이 정해져야 하므로 Parameter Store에서 온다.
springdoc:
  server-url: "http://localhost:8080"

# 쉼표로 구분된 문자열. @Value("${cors.allowed-origins}") List<String>가 쉼표로 쪼갠다.
# YAML 리스트로 쓰면 cors.allowed-origins[0]... 인덱스 키가 되어 스칼라 플레이스홀더가 안 잡힌다.
# prod는 Parameter Store에서 같은 쉼표 문자열로 온다.
cors:
  allowed-origins: "http://localhost:3000,http://localhost:5173"

# 기본 레벨은 INFO다. SQL·필터·요청 로그는 전부 DEBUG 이하라 켜주지 않으면 한 줄도 안 남는다.
# 운영에 그대로 나가면 매 쿼리와 필터 실행이 찍혀 로그를 잡아먹으므로 로컬 전용으로 둔다.
logging:
  level:
    com.soma.wes: DEBUG
    org.hibernate.SQL: DEBUG
    # SQL의 `?`에 실제로 바인딩된 값. Hibernate 6부터 로거 이름이 이걸로 바뀌었다.
    org.hibernate.orm.jdbc.bind: TRACE
    org.springframework.security.web.FilterChainProxy: TRACE
    # 시작 시 "Mapping filters: ..." — 서블릿 컨테이너에 등록된 필터 목록과 순서(order)
    org.springframework.boot.web.servlet: DEBUG

---
spring:
  config:
    activate:
      on-profile: prod

# ALB가 TLS를 끝내고 평문 HTTP로 넘긴다. 이 설정이 없으면 앱은 자기가 http://로 서비스되는 줄 알고
# 절대 URL과 리다이렉트를 http로 만든다. X-Forwarded-* 를 읽어 원래 요청(https, api.easyselect.kr)을
# 복원한다. `framework`는 서블릿 컨테이너가 아니라 Spring의 필터로 처리한다는 뜻이다.
server:
  forward-headers-strategy: framework

# /actuator/**는 PublicPaths에서 인증 없이 열려 있다. 노출 대상을 명시해 두지 않으면
# 나중에 다른 엔드포인트가 켜졌을 때 그대로 공개된다. health 하나만 연다.
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      # 컨테이너·ALB의 health check는 up/down만 알면 된다. DB 접속 정보나 디스크 용량 같은
      # 내부 사정을 인증 없이 내보낼 이유가 없다.
      show-details: never

# springdoc.server-url과 cors.allowed-origins는 Parameter Store(/wes/prod/)에서 온다.
# cors.allowed-origins에 배포 프론트와 함께 http://localhost:3000을 넣어두면,
# 로컬 프론트로도 운영 API에 붙어 로그인을 테스트할 수 있다(아래 redirect-uri 규칙과 맞물린다).

oauth:
  fallback-redirect-origin: http://localhost:3000

logging:
  level:
    com.soma.wes: INFO
