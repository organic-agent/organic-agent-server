spring:
  application:
    name: wes

  # 테스트는 Parameter Store를 쓰지 않는다. 스타터가 켜져 있으면 ParameterStoreAutoConfiguration이
  # 시작 시 SsmClient 빈을 만들며 AWS 리전을 요구해, 리전이 없는 CI에서 컨텍스트 로딩이 실패한다.
  cloud:
    aws:
      parameterstore:
        enabled: false
      region:
        # S3Presigner와 LambdaClient는 파라미터 스토어와 달리 끌 수 없다(빈이 필요하다).
        # CI 러너에는 AWS_REGION도 ~/.aws/config도 없어서 못박지 않으면 기동이 깨진다.
        static: ap-northeast-2
      credentials:
        # presigned URL 서명은 순수 로컬 계산이라 아무 자격증명이나 있으면 되고,
        # 없으면 SDK가 자격증명 탐색에 실패해 기동이 깨진다. 이 키로는 AWS에 아무것도 못 한다.
        access-key: test-access-key
        secret-key: test-secret-key

  # 운영과 같은 방식으로 스키마를 만든다. 마이그레이션이 깨지면 배포가 아니라 여기서 먼저 걸린다.
  flyway:
    enabled: true

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Seoul

  # 테스트 컨텍스트가 ClientRegistrationRepository를 만들 수 있도록 형태만 갖춘 더미 설정.
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: test-client-id
            client-secret: test-client-secret
            redirect-uri: http://localhost:3000/login/oauth2/code/google
            authorization-grant-type: authorization_code
            scope: profile,email
          kakao:
            client-id: test-client-id
            client-secret: test-client-secret
            redirect-uri: http://localhost:3000/login/oauth2/code/kakao
            authorization-grant-type: authorization_code
            client-authentication-method: client_secret_post
            scope: profile_nickname,account_email
          naver:
            client-id: test-client-id
            client-secret: test-client-secret
            redirect-uri: http://localhost:3000/login/oauth2/code/naver
            authorization-grant-type: authorization_code
            scope: nickname,email
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id
          naver:
            authorization-uri: https://nid.naver.com/oauth2.0/authorize
            token-uri: https://nid.naver.com/oauth2.0/token
            user-info-uri: https://openapi.naver.com/v1/nid/me
            user-name-attribute: response

springdoc:
  server-url: http://localhost:8080

cors:
  allowed-origins: http://localhost:3000

jwt:
  secret: test-secret-key-for-hs256-must-be-at-least-32-bytes
  access-token-expiration: 30m
  refresh-token-expiration: 14d

app:
  storage:
    # 실제 버킷이 아니다. 서명 URL의 형태만 확인하는 용도로, 이 이름으로는 아무것도 올라가지 않는다.
    bucket: wes-test-photos
    upload-url-ttl: 30m
    view-url-ttl: 15m
    # 상세 화면의 원본 URL은 목록보다 오래 산다. 테스트도 그 차이를 그대로 둔다 —
    # 두 값을 같게 맞추면 응답이 어느 쪽으로 서명됐는지 구분할 수 없다.
    original-url-ttl: 1h
    max-batch-size: 1000
  embedding:
    # 테스트에는 Lambda가 없다. 비어 있는 것이 정상이고, 호출 시점에 503으로 실패한다.
    function-name: ""
  cluster:
    # 운영과 같은 번들을 쓴다 — 평가 하네스가 이 값을 그대로 측정하므로 여기가 어긋나면
    # 테스트가 재는 것이 배포되는 프리셋이 아니게 된다.
    default-level: 3
    levels:
      1: { strict-threshold: 0.86, lenient-threshold: 0.78, window-seconds: 150 }
      2: { strict-threshold: 0.90, lenient-threshold: 0.80, window-seconds: 150 }
      3: { strict-threshold: 0.92, lenient-threshold: 0.82, window-seconds: 90 }
      4: { strict-threshold: 0.94, lenient-threshold: 0.82, window-seconds: 90 }
      5: { strict-threshold: 0.96, lenient-threshold: 0.84, window-seconds: 45 }
  invite:
    # 실제 프론트가 아니다. 링크가 "베이스 + 토큰"으로 조립되는지만 확인한다.
    base-url: "http://localhost:3000/invite"
  collab:
    # 초대와 다른 화면이라 값도 다르다. 두 링크가 섞이지 않는지 테스트가 이 차이로 확인한다.
    base-url: "http://localhost:3000/collab"
