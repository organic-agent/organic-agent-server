spring:
  application:
    name: wes

  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  # 테스트 컨텍스트가 ClientRegistrationRepository를 만들 수 있도록 형태만 갖춘 더미 설정.
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: test-client-id
            client-secret: test-client-secret
            redirect-uri: http://localhost:3000/login/oauth2/code/google
            authorization-grant-type: authorization_code
            scope: profile,email
          kakao:
            client-id: test-client-id
            client-secret: test-client-secret
            redirect-uri: http://localhost:3000/login/oauth2/code/kakao
            authorization-grant-type: authorization_code
            client-authentication-method: client_secret_post
            scope: profile_nickname,account_email
          naver:
            client-id: test-client-id
            client-secret: test-client-secret
            redirect-uri: http://localhost:3000/login/oauth2/code/naver
            authorization-grant-type: authorization_code
            scope: nickname,email
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id
          naver:
            authorization-uri: https://nid.naver.com/oauth2.0/authorize
            token-uri: https://nid.naver.com/oauth2.0/token
            user-info-uri: https://openapi.naver.com/v1/nid/me
            user-name-attribute: response

springdoc:
  server-url: http://localhost:8080

cors:
  allowed-origins: http://localhost:3000

jwt:
  secret: test-secret-key-for-hs256-must-be-at-least-32-bytes
  access-token-expiration: 30m
  refresh-token-expiration: 14d
