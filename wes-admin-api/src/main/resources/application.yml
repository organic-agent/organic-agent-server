spring:
  application:
    name: wes-admin-api

  config:
    import:
      - optional:classpath:/config/application-cloud.yml
      - optional:classpath:/config/application-db.yml
      - optional:classpath:/config/application-variable.yml

  # 관리자 앱은 어떤 환경에서도 스키마를 변경하지 않는다. 공개 API가 유일한 migration owner다.
  flyway:
    enabled: false

  # 관리자 트래픽은 백오피스 요청과 스케줄러 스레드 1개의 크론뿐이라 기본 10개 중 대부분이 늘 놀았다.
  # 연결 하나가 RDS 프로세스 하나(메모리)라, 놀던 7개를 분석 파이프라인 몫으로 돌린다(#274 D-4).
  datasource:
    hikari:
      maximum-pool-size: 3

server:
  port: 8081

# 관리자 앱에는 공개 API 문서 엔드포인트가 없다. starter는 공통 라이브러리의 전이 의존성으로
# classpath에 남아 있으므로 자동 구성을 설정으로도 명시적으로 닫는다.
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

---
spring:
  config:
    activate:
      on-profile: local
    import: aws-parameterstore:/wes/admin-api/local/

---
spring:
  config:
    activate:
      on-profile: prod
    import: aws-parameterstore:/wes/admin-api/prod/

  flyway:
    enabled: false

---
# dev 관리자 호스트(wes-dev-admin, infra environments/dev). 환경 차이는 전부 /wes/admin-api/dev/ 가 낸다.
spring:
  config:
    activate:
      on-profile: dev
    import: aws-parameterstore:/wes/admin-api/dev/

  flyway:
    enabled: false
