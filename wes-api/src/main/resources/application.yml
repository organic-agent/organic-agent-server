spring:
  application:
    name: wes-api

  # 공개 API가 운영 스키마의 유일한 migration owner다.
  flyway:
    enabled: true

  config:
    import:
      - optional:classpath:/config/application-cloud.yml
      - optional:classpath:/config/application-db.yml
      - optional:classpath:/config/application-variable.yml
      - classpath:/config/application-api-runtime.yml

app:
  activity:
    buffer:
      # 활동 시각을 요청마다 쓰지 않고 모아 5초마다 쓴다(#286 (f)) — 한 스튜디오의 갤러리 여럿에서 동시에 쓰면 모든 쓰기가
      # workspace_activity 한 행을 기다렸다(R-3-a4). 공개 API만 켠다: 테스트는 이 파일을 읽지 않아 지금처럼 바로 쓴다.
      enabled: true
      flush-interval: PT5S
  access-cache:
    # 권한 확인(계정 상태·작업공간 종류·스튜디오 정지)을 요청마다 DB에서 다시 읽지 않고 30초 동안 앱 메모리에서 읽는다(#286 (k)).
    # 관리자 정지는 관리자 앱에서 일어나 이 메모리를 지울 수 없다 — 정지가 반영되기까지 최대 ttl(작성자 결정 30초). 공개 API만 켠다.
    enabled: true
    ttl: PT30S

---
spring:
  config:
    activate:
      on-profile: local
    import: aws-parameterstore:/wes/local/

app:
  analysis:
    # 로컬에는 Lambda가 없다. "AI 분석" 버튼이 이 디렉토리의 <함수>.sh(embedder·score·categorize)를
    # 운영의 Lambda EVENT 자리에서 띄운다 (AI repo venv·S3 버킷은 스크립트가 정한다).
    local-script-dir: scripts/lambda
    # 대역 스크립트는 호출마다 torch 프로세스 하나(2~4GB)다. 운영 기본값(임베더 32개 동시, score 50장씩 상한 없이)을
    # 그대로 쓰면 노트북 메모리를 넘긴다 — 로컬은 샤딩하지 않는다. 임베더는 한 번에 하나씩, score 폴백은 갤러리당 프로세스 하나.
    embed-max-in-flight: 1
    score-batch-size: 10000

---
spring:
  config:
    activate:
      on-profile: prod
    import: aws-parameterstore:/wes/prod/

---
# 운영과 같은 규격의 dev 서버(dev-api.easyselect.kr, 인프라 environments/dev). 설정은 prod 블록을 같이 쓰고
# 환경 차이(DB·버킷·Lambda·GPU 태그·도메인)는 전부 Parameter Store /wes/dev/ 가 낸다.
spring:
  config:
    activate:
      on-profile: dev
    import: aws-parameterstore:/wes/dev/
