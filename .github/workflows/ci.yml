name: 공통 CI

on:
  pull_request:
    branches: [main]

# 테스트 결과를 체크로 남기려면 쓰기 권한이 필요하다.
permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  test:
    name: 테스트 코드 실행
    runs-on: ubuntu-latest

    steps:
      - name: 체크아웃
        uses: actions/checkout@v4

      - name: JDK 버전 설정
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: gradle

      # 일부 테스트가 Testcontainers로 postgres를 띄운다. GitHub 러너에는 Docker가 있어 그대로 돈다.
      # TODO: 테스트 컨벤션 정립 후 게이팅 복구. 지금은 테스트가 실패해도 CI를 막지 않는다
      #       (continue-on-error + publish fail_on:nothing). 결과는 체크에 남지만 빨간 X로 머지를 막지 않는다.
      - name: Lambda DB 계약 테스트
        continue-on-error: true
        run: python3 -S -m unittest discover -s embedder/tests -p 'test_*.py' -v

      - name: 테스트 실행
        continue-on-error: true
        run: |
          chmod +x ./gradlew
          ./gradlew test --no-daemon

      - name: 테스트 결과 출력
        uses: EnricoMi/publish-unit-test-result-action@v2
        # 테스트가 깨졌을 때야말로 결과를 봐야 하므로 실패해도 실행한다.
        if: always()
        with:
          files: build/test-results/test/TEST-*.xml
          # 결과는 리포트로 남기되, 실패해도 이 액션이 체크를 실패시키지 않는다.
          fail_on: nothing
