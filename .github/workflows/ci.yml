name: 공통 CI

on:
  pull_request:
    branches: [main, develop]

# 테스트 결과를 체크로 남기려면 쓰기 권한이 필요하다.
permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  test:
    name: 테스트 코드 실행
    runs-on: ubuntu-latest

    steps:
      - name: 체크아웃
        uses: actions/checkout@v4

      - name: JDK 버전 설정
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: gradle

      - name: 테스트 실행
        run: |
          chmod +x ./gradlew
          ./gradlew test --no-daemon

      - name: GitHub Actions run 길이 제한 검사
        run: ruby ./scripts/check-workflow-run-size.rb

      - name: 관리자 배포 경계 검사
        run: bash ./scripts/check-admin-deployment-boundary.sh

      - name: 테스트 결과 출력
        uses: EnricoMi/publish-unit-test-result-action@v2
        # 테스트가 깨졌을 때야말로 결과를 봐야 하므로 실패해도 실행한다.
        if: always()
        with:
          files: "**/build/test-results/test/TEST-*.xml"
