name: 공통 CI

on:
  pull_request:
    branches: [main]

# 테스트 결과를 체크로 남기려면 쓰기 권한이 필요하다.
permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  test:
    name: 테스트 코드 실행
    runs-on: ubuntu-latest

    steps:
      - name: 체크아웃
        uses: actions/checkout@v4

      - name: JDK 버전 설정
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: gradle

      - name: Python 3.12 설정
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: embedder/requirements-audit.txt

      - name: worker Python 의존성 취약점 검사
        run: |
          python3 -m pip install --disable-pip-version-check pip-audit==2.10.1
          pip-audit \
            --requirement embedder/requirements-audit.txt \
            --index-url https://pypi.org/simple \
            --extra-index-url https://download.pytorch.org/whl/cpu \
            --progress-spinner off \
            --strict

      # 일부 테스트가 Testcontainers로 postgres를 띄운다. GitHub 러너에는 Docker가 있어 그대로 돈다.
      - name: Lambda DB 계약 테스트
        run: python3 -S -m unittest discover -s embedder/tests -p 'test_*.py' -v

      - name: 테스트 실행
        run: |
          chmod +x ./gradlew
          ./gradlew test --no-daemon

      - name: 관리자 배포 경계 검사
        run: bash ./scripts/check-admin-deployment-boundary.sh

      - name: worker 배포 경계 검사
        run: bash ./scripts/check-worker-deployment-boundary.sh

      - name: 테스트 결과 출력
        uses: EnricoMi/publish-unit-test-result-action@v2
        # 테스트가 깨졌을 때야말로 결과를 봐야 하므로 실패해도 실행한다.
        if: always()
        with:
          files: "**/build/test-results/test/TEST-*.xml"
