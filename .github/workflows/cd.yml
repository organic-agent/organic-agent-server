name: "[PROD] Build and Deploy"

on:
  # 초기 단계라 버저닝(릴리스 태그) 없이 main에 머지되면 바로 배포한다.
  # 안정화되면 release 트리거 + semver 태그로 승격한다.
  push:
    branches: [main]

  # 재배포(같은 latest 이미지 다시 올리기)용 수동 실행.
  workflow_dispatch:

env:
  IMAGE_BASENAME: wes-server
  # EC2 아키텍처와 맞아야 한다. Graviton(t4g·m7g·c7g 등)이면 linux/arm64,
  # 그 외 t3·m5 등 인텔/AMD 계열이면 linux/amd64.
  # 어긋나면 컨테이너가 `exec format error`로 즉시 죽는다.
  # → Graviton(ARM) 인스턴스를 쓰기로 해서 arm64로 빌드한다.
  #    Dockerfile엔 RUN 스텝이 없어(COPY + ENTRYPOINT뿐) amd64 러너에서 QEMU 없이 빌드된다.
  PLATFORM: linux/arm64

jobs:
  # --- Job 1: 빌드 및 이미지 푸시 (쓰기 권한) ---
  build-and-push:
    name: 빌드 후 GHCR에 푸쉬
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    outputs:
      owner_lowercase: ${{ steps.image_meta.outputs.owner_lowercase }}

    steps:
      - name: 체크아웃
        uses: actions/checkout@v4

      - name: JDK 21 설정
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: gradle

      - name: JAR 빌드
        run: |
          chmod +x ./gradlew
          ./gradlew clean build --no-daemon

      - name: Docker Buildx 설정
        uses: docker/setup-buildx-action@v3

      # 등록할 시크릿이 없다. GITHUB_TOKEN은 실행마다 자동으로 발급된다.
      - name: GHCR 로그인
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 이미지 이름 결정
        id: image_meta
        run: |
          # GHCR 경로는 소문자만 받는다. 조직명에 대문자가 있어도 안전하도록 변환한다.
          OWNER_LOWERCASE=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')

          echo "owner_lowercase=${OWNER_LOWERCASE}" >> $GITHUB_OUTPUT
          echo "image_name=ghcr.io/${OWNER_LOWERCASE}/${IMAGE_BASENAME}" >> $GITHUB_OUTPUT

      - name: 이미지 빌드 및 푸쉬
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ env.PLATFORM }}
          push: true
          # 초기 단계라 latest 하나만 올린다. 버저닝(태그 롤백)은 나중에 도입한다.
          tags: ${{ steps.image_meta.outputs.image_name }}:latest

  # --- Job 2: 배포 (읽기 권한) ---
  deploy:
    name: EC2에 배포
    needs: build-and-push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read

    env:
      OWNER_LOWERCASE: ${{ needs.build-and-push.outputs.owner_lowercase }}

    steps:
      # 서버로 보낼 것은 compose 파일 하나뿐이라 저장소 전체를 받지 않는다.
      - name: 설정 파일만 체크아웃
        uses: actions/checkout@v4
        with:
          sparse-checkout: docker-compose.prod.yml
          sparse-checkout-cone-mode: false

      - name: compose 파일 전송
        run: |
          echo "${{ secrets.PRIVATE_KEY }}" > deploy_key.pem
          chmod 600 deploy_key.pem

          WORK_DIR="/home/${{ secrets.USERNAME }}/wes-prod"

          # 첫 배포에는 디렉터리가 없다. scp는 없는 경로에 못 쓴다.
          # StrictHostKeyChecking=no는 러너가 매번 새 호스트라 known_hosts가 비어 있기 때문이다.
          ssh -i deploy_key.pem -o StrictHostKeyChecking=no \
            "${{ secrets.USERNAME }}@${{ secrets.HOST }}" "mkdir -p $WORK_DIR"

          scp -i deploy_key.pem -o StrictHostKeyChecking=no \
            ./docker-compose.prod.yml \
            "${{ secrets.USERNAME }}@${{ secrets.HOST }}:$WORK_DIR/"

      - name: 컨테이너 교체
        run: |
          ssh -i deploy_key.pem -o StrictHostKeyChecking=no \
            "${{ secrets.USERNAME }}@${{ secrets.HOST }}" '
              set -e

              # compose 파일의 ${...}를 채울 값. 서버에 .env를 남기지 않는다.
              # IMAGE_TAG는 넘기지 않는다 — compose의 ${IMAGE_TAG:-latest} 기본값이 latest다.
              export OWNER_LOWERCASE="${{ env.OWNER_LOWERCASE }}"
              WORK_DIR="/home/${{ secrets.USERNAME }}/wes-prod"

              # GHCR 패키지가 private이면 pull에 로그인이 필요하다.
              # 패키지를 public으로 바꾸면 이 줄은 지워도 된다.
              echo "${{ secrets.GITHUB_TOKEN }}" \
                | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

              cd "$WORK_DIR"
              docker compose -f docker-compose.prod.yml pull
              docker compose -f docker-compose.prod.yml up -d --force-recreate

              # 새 latest를 pull하면 이전 이미지는 태그를 잃고 dangling(<none>)이 된다.
              # 작은 EC2는 이미지로 디스크가 차므로 그것들을 지운다.
              docker image prune -f
            '

      - name: 헬스체크
        run: |
          ssh -i deploy_key.pem -o StrictHostKeyChecking=no \
            "${{ secrets.USERNAME }}@${{ secrets.HOST }}" '
              # 기동에 시간이 걸린다(Parameter Store 조회 + 컨텍스트 초기화).
              # 상태 코드로 판단한다. 200 = UP, 503 = DOWN.
              for i in $(seq 1 30); do
                HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
                  --connect-timeout 2 "http://localhost:8080/actuator/health" || true)
                [ "$HTTP_CODE" = "200" ] && { echo "기동 완료 (${i}번째 시도)"; exit 0; }
                sleep 5
              done

              echo "150초 안에 기동하지 못했습니다" >&2
              docker logs --tail 50 wes-app
              exit 1
            '
