name: "[PROD] develop → main FF 머지"

# develop → main PR을 머지 커밋 없이(fast-forward) main에 올린다. GitHub의 머지 버튼은 머지·스쿼시·리베이스 중 어느 것도
# develop과 같은 SHA를 main에 두지 못한다 — 이 워크플로가 develop의 SHA를 그대로 main에 민다.
#
# 조건: PR(base main, head develop)이 열려 있고, write 이상 권한자가 `ready-to-merge` 라벨을 붙였고, head SHA의 체크가 전부 통과.
# 마지막 조건이 늦게 채워지는 경우를 위해 두 이벤트에서 다시 확인한다:
#   - 라벨 부착 (pull_request labeled)
#   - CI·dev 배포 완료 (workflow_run) — `check_suite`는 Actions가 만든 스위트에 대해 이벤트가 나지 않아 쓰지 않는다.
#     workflow_run은 기본 브랜치(main)에 있는 이 파일로만 돈다.
#
# GITHUB_TOKEN의 push는 다른 워크플로를 띄우지 않으므로, push 뒤 운영 CD(cd-prod.yml)를 workflow_dispatch로 직접 띄운다.
# main에 브랜치 보호(푸시 제한)를 걸면 이 push가 막힌다 — 그때는 github-actions 우회 허용이나 PAT·GitHub App 토큰이 필요하다.

on:
  pull_request:
    types: [labeled]
  workflow_run:
    workflows: ["공통 CI", "[DEV] Build and Deploy"]
    types: [completed]
    branches: [develop]

# 라벨과 CI 완료가 겹쳐도 한 번에 하나만 돈다(sync-develop.yml과 같은 그룹). 뒤에 온 실행은 main이 이미 그 SHA면 아무것도 하지 않는다.
concurrency:
  group: wes-main-develop-sync
  cancel-in-progress: false

permissions:
  contents: write # main push
  actions: write # cd-prod.yml workflow_dispatch
  checks: read
  pull-requests: read

jobs:
  ff-merge:
    if: |
      (github.event_name == 'pull_request' && github.event.label.name == 'ready-to-merge') ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest

    steps:
      - name: PR 조회 및 조건 검증
        id: validate
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            let prNumber, headSha;

            if (context.eventName === 'pull_request') {
              const pr = context.payload.pull_request;
              if (pr.base.ref !== 'main' || pr.head.ref !== 'develop' || pr.state !== 'open') {
                core.info('develop → main PR이 아니다');
                core.setOutput('ready', 'false');
                return;
              }

              // 라벨을 붙인 사람의 저장소 권한 확인
              const { data: perm } = await github.rest.repos.getCollaboratorPermissionLevel({
                owner, repo, username: context.payload.sender.login,
              });
              if (!['admin', 'write'].includes(perm.permission)) {
                core.info(`라벨 부착자 권한 부족: ${perm.permission}`);
                core.setOutput('ready', 'false');
                return;
              }

              prNumber = pr.number;
              headSha = pr.head.sha;
            } else {
              const { data: prs } = await github.rest.pulls.list({
                owner, repo, state: 'open', base: 'main', head: `${owner}:develop`,
              });
              if (prs.length === 0) {
                core.info('열린 develop → main PR이 없다');
                core.setOutput('ready', 'false');
                return;
              }

              prNumber = prs[0].number;
              headSha = prs[0].head.sha;

              if (context.payload.workflow_run.head_sha !== headSha) {
                core.info('완료된 실행이 PR head SHA의 것이 아니다');
                core.setOutput('ready', 'false');
                return;
              }
            }

            // ready-to-merge 라벨 확인 (workflow_run 경로, 라벨 부착 뒤 제거된 경우)
            const { data: pr } = await github.rest.pulls.get({ owner, repo, pull_number: prNumber });
            if (!pr.labels.some(l => l.name === 'ready-to-merge')) {
              core.info('ready-to-merge 라벨이 없다');
              core.setOutput('ready', 'false');
              return;
            }

            // head SHA의 체크 전부 확인 — 공통 CI와 dev 배포(cd-dev.yml)가 같은 SHA에 체크를 남긴다.
            // 이 워크플로 자신의 체크(진행 중·이전 실행)는 뺀다.
            const checkRuns = await github.paginate(github.rest.checks.listForRef, {
              owner, repo, ref: headSha, per_page: 100,
            });
            const ciRuns = checkRuns.filter(r => r.name !== context.job);
            const pending = ciRuns.filter(r =>
              r.status !== 'completed' || !['success', 'skipped', 'neutral'].includes(r.conclusion)
            );
            if (ciRuns.length === 0 || pending.length > 0) {
              core.info(`아직 통과하지 않은 체크: ${pending.map(r => `${r.name}(${r.status}/${r.conclusion})`).join(', ') || '없음(체크 0개)'}`);
              core.setOutput('ready', 'false');
              return;
            }

            core.setOutput('ready', 'true');
            core.setOutput('head_sha', headSha);
            core.setOutput('pr_number', String(prNumber));

      - name: 체크아웃
        if: steps.validate.outputs.ready == 'true'
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Git 설정
        if: steps.validate.outputs.ready == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: develop 변경 여부 검증
        id: guard
        if: steps.validate.outputs.ready == 'true'
        env:
          APPROVED_SHA: ${{ steps.validate.outputs.head_sha }}
        run: |
          CURRENT_SHA=$(git rev-parse origin/develop)
          if [ "$APPROVED_SHA" != "$CURRENT_SHA" ]; then
            echo "검증 이후 develop이 변경되었습니다. 새 head의 CI가 끝나면 다시 시도됩니다." >&2
            echo "  검증 시점 SHA: $APPROVED_SHA" >&2
            echo "  현재 SHA:      $CURRENT_SHA" >&2
            exit 1
          fi

          # 라벨·CI 완료가 겹쳐 앞선 실행이 이미 올렸으면 다시 배포하지 않는다.
          if [ "$(git rev-parse origin/main)" = "$APPROVED_SHA" ]; then
            echo "main이 이미 $APPROVED_SHA 입니다. 건너뜁니다."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: FF-Only 머지 develop → main
        if: steps.validate.outputs.ready == 'true' && steps.guard.outputs.skip != 'true'
        env:
          APPROVED_SHA: ${{ steps.validate.outputs.head_sha }}
        run: |
          if ! git merge --ff-only "$APPROVED_SHA"; then
            echo "main에 develop에 없는 커밋이 있어 fast-forward가 안 됩니다. main을 develop에 먼저 반영하세요." >&2
            exit 1
          fi
          git push origin main

      # GITHUB_TOKEN의 push는 cd-prod.yml(push: main)을 띄우지 않는다. workflow_dispatch는 예외라 직접 띄운다.
      - name: 운영 배포 실행
        if: steps.validate.outputs.ready == 'true' && steps.guard.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run cd-prod.yml --ref main --repo "${{ github.repository }}"
