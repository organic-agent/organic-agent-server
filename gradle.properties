# 입력이 같은 태스크(컴파일 등)는 결과를 캐시에서 꺼낸다. CI는 ~/.gradle/caches/build-cache-1 을 실행 사이에 넘긴다(ci.yml).
org.gradle.caching=true
# wes-api·wes-admin-api의 컴파일·테스트를 나란히 돌린다. 두 테스트 JVM은 각자 Postgres 컨테이너 하나를 띄운다.
org.gradle.parallel=true
# Gradle·Kotlin 데몬 힙. 기본값(Gradle 512MB)으로는 CI(--no-daemon, 두 모듈 나란히)에서 wes-admin-api 테스트 컴파일이
# "GC overhead limit exceeded"로 멈췄다(#313 PR #315 — Redis 의존성이 더해져 클래스패스가 커진 뒤). 러너는 16GB라 넉넉히 준다.
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx2g
